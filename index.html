<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Tablet / no-zoom viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

    <!-- PWA theme -->
    <meta name="theme-color" content="#FAF7F2" />
    <meta name="description" content="Kitchen inventory and meal planning — optimised for a fridge-mounted tablet." />

    <!-- Web app manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS PWA (must come before any script tags) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kitchen Hub" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Favicon fallback -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <title>Kitchen Hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
